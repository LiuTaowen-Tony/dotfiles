# ~/.tmux.conf  (symlinked from ~/dotfiles/tmux.conf)

set -g mouse off                              # existing choice: mouse off

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"     # truecolor passthrough
set -sg escape-time 0                          # no esc delay (matters for vim)
set -g focus-events on
set -g history-limit 50000

set -g base-index 1                            # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on                     # keep window numbers gapless

setw -g mode-keys vi                           # vi keys in copy mode

# reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# splits keep the current pane's working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
